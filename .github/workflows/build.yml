name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Mineflayer bridge
        run: node --test integrations/mineflayer/test/*.test.js

      - name: Install acceptance bot dependencies
        run: npm ci --prefix integrations/mineflayer-test

      - name: Test acceptance bot
        run: node --test integrations/mineflayer-test/test/*.test.js

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: curio-observer
          path: build/libs/*.jar
          if-no-files-found: error
