plugins {
    id 'net.fabricmc.fabric-loom-remap'
}

ext {
    mcVersion = '1.21.10'
    mcSpan = '1.21.9-1.21.10'
    mcRange = '>=1.21.9 <=1.21.10'
    fabricVersion = '0.138.4+1.21.10'
    javaVersion = 21
    compatLayers = [
        'item-components',
        'hand-1219',
        'canvas-1216',
        'screen-1219',
        'mc-1219',
        'mixin-stability-legacy',
        'mixin-nightvision',
        'mixin-lightmap-119',
        'mixin-camera-float',
        'mixin-hand-1216',
        'mixin-hud-1216',
        'mixin-spectator-1216',
    ]
    testCompatLayers = ['test-mixin']
    mixinClasses = [
        'SpectatorHudMixin', 'InGameHudMixin', 'HeldItemRendererMixin',
        'BroadcastCameraMixin', 'BroadcastStabilityMixin', 'BroadcastLightmapMixin', 'BroadcastNightVisionMixin'
    ]
}

apply from: rootProject.file('gradle/fabric-remap-target.gradle')
