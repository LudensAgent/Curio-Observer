plugins {
    id 'net.fabricmc.fabric-loom-remap'
}

ext {
    mcVersion = '1.21.8'
    mcSpan = '1.21.6-1.21.8'
    mcRange = '>=1.21.6 <=1.21.8'
    fabricVersion = '0.136.1+1.21.8'
    javaVersion = 21
    compatLayers = [
        'item-components',
        'hand-1215',
        'canvas-1216',
        'screen-1202',
        'mc-1216',
        'mixin-stability-legacy',
        'mixin-nightvision',
        'mixin-lightmap-119',
        'mixin-camera-float',
        'mixin-hand-1216',
        'mixin-hud-1216',
        'mixin-spectator-1216',
    ]
    testCompatLayers = ['test-mixin', 'test-components']
    mixinClasses = [
        'SpectatorHudMixin', 'InGameHudMixin', 'HeldItemRendererMixin',
        'BroadcastCameraMixin', 'BroadcastStabilityMixin', 'BroadcastLightmapMixin', 'BroadcastNightVisionMixin'
    ]
}

apply from: rootProject.file('gradle/fabric-remap-target.gradle')
