version = project.property('mod_version')
group = project.property('maven_group')

def versionProjects = { subprojects.findAll { it.path.startsWith(':versions:') } }

tasks.register('collectReleaseJars', Copy) {
    group = 'build'
    description = 'Collects all release Fabric mod JARs into build/libs/'
    into layout.buildDirectory.dir('libs')
    doFirst {
        delete layout.buildDirectory.dir('libs')
    }
}

gradle.projectsEvaluated {
    def collect = tasks.named('collectReleaseJars', Copy)
    versionProjects().each { sub ->
        def jarTask = sub.ext.releaseJarTask
        collect.configure {
            dependsOn jarTask
            from(jarTask.flatMap { it.archiveFile })
        }
    }
}

tasks.register('check') {
    group = 'verification'
    dependsOn ':common:check'
    dependsOn { versionProjects().collect { "${it.path}:check" } }
}

tasks.register('test') {
    group = 'verification'
    dependsOn ':common:test'
    dependsOn { versionProjects().collect { "${it.path}:test" } }
}

tasks.register('build') {
    group = 'build'
    dependsOn tasks.named('check'), tasks.named('collectReleaseJars')
}

tasks.register('clean', Delete) {
    group = 'build'
    delete layout.buildDirectory
    dependsOn subprojects.collect { "${it.path}:clean" }
}
